# Noctalia kitty config
font_family      JetBrainsMono Nerd Font
font_size        11.0
background_opacity 0.5
dynamic_background_opacity yes
background_blur 20
hide_window_decorations yes

# Noctalia palette (sync voi ~/.config/noctalia/colors.json)
background #261d18
foreground #f3f2f2
selection_background #e49767
selection_foreground #251d18

# basic colors
