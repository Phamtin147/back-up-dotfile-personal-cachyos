color3 #d6c85c
color4 #e49767
color5 #b6b2af
color6 #3f3027
color7 #f3f2f2
color8 #73675e
color9 #fd4663
color10 #a5cc66
color11 #d6c85c
color12 #e49767
color13 #b6b2af
color14 #3f3027
color15 #f3f2f2

cursor #e49767
cursor_text_color #251d18

# kitty graphics protocol mac dinh ON - yazi se dung adapter kitty
allow_remote_control yes
