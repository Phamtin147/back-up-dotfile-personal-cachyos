# hyprlock.conf - Omarchy exact layout synced with Noctalia theme

$color = rgb({{colors.surface.default.hex_stripped}})
$inner_color = rgba({{colors.surface_container.default.hex_stripped}}dd)
$outer_color = rgb({{colors.primary.default.hex_stripped}})
$font_color = rgb({{colors.on_surface.default.hex_stripped}})
$check_color = rgb({{colors.tertiary.default.hex_stripped}})
$topbar_color = rgba({{colors.surface.default.hex_stripped}}ff)

## General configs
general {
    ignore_empty_input = true
    hide_cursor = true
}

auth {
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeInCubic, 0.32, 0, 0.67, 0
    animation = fadeIn, 1, 5, easeOutCubic
    animation = fadeOut, 1, 5, easeInCubic
    animation = inputFieldDots, 1, 3, easeOutCubic
}

## Wallpaper
background {
    monitor =
    color = $color
    path = screenshot
    blur_passes = 5
}

## Password field
input-field {
    monitor =
    size = 550, 55
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4
    dots_size = 0.24
    dots_spacing = 0.24

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = <span size="smaller" alpha="50%">Enter Password</span>
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

## Top bar
shape {
    size = 100%, 52
    position = 0, 0
    halign = center
    valign = top
    color = $topbar_color
    border_size = 0
    rounding = 0
}

## Clock
label {
    text = $TIME
    font_size = 18
    halign = center
    valign = top
    position = 5, -9
    font_family = JetBrainsMono Nerd Font Propo
    color = $font_color
}

## Right portion of top bar
label {
    text = cmd[update:2000] hyprlock-bar-right
    font_size = 18
    text_align = right
    halign = right
    valign = top
    position = -32, -9
    font_family = JetBrainsMono Nerd Font Propo
    color = $font_color
}

## System info line
label {
    text = cmd[update:3600000] hyprlock-system-info
    font_size = 10
    halign = center
    valign = bottom
    position = 0, 80
    font_family = JetBrainsMono Nerd Font
    color = $font_color
}

## KVM label
label {
    text = cmd[update:2000] bash -c 'grep -q "Name=\"CX 2.4G Wireless Receiver Keyboard\"" /proc/bus/input/devices && echo "KVM"'
    font_size = 10
    halign = center
    valign = center
    position = 380, 0
    font_family = JetBrainsMono Nerd Font
    color = $font_color
}

## Bindings
label {
    text = <span weight="bold" alpha="72%">[Super+Esc]</span> <span alpha="56%">Display off</span>   <span weight="bold" alpha="72%">[Super+S]</span> <span alpha="56%">Suspend</span>   <span weight="bold" alpha="72%">[Super+R]</span> <span alpha="56%">Reboot</span>   <span weight="bold" alpha="72%">[Super+P]</span> <span alpha="56%">Power off</span>
    font_size = 10
    halign = center
    valign = bottom
    position = 0, 45
    font_family = JetBrainsMono Nerd Font
    color = $font_color
}
