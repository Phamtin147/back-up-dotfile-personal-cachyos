<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias>
        <family>monospace</family>
        <prefer>
            <family>MesloLGS Nerd Font</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>Latin Modern Mono</family>
        <prefer><family>LMMono10</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Latin Modern Mono 10 Regular</family>
        <prefer><family>LMMono10</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Latin Modern Mono 8 Regular</family>
        <prefer><family>LMMono8</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Latin Modern Mono 9 Regular</family>
        <prefer><family>LMMono9</family></prefer>
    </alias>
</fontconfig>
