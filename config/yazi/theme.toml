# Matugen template: yazi file manager theme from wallpaper

[mode]
normal_main = { fg = "#3d2e18", bg = "#dbc3a3", bold = true }
normal_alt  = { fg = "#dbc3a3", bg = "reset" }
select_main = { fg = "#372f24", bg = "#d2c4b5", bold = true }
select_alt  = { fg = "#d2c4b5", bg = "reset" }
unset_main  = { fg = "#273140", bg = "#bdc7da", bold = true }
unset_alt   = { fg = "#bdc7da", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#dbc3a3", bold = true }
perm_read  = { fg = "#bdc7da" }
perm_write = { fg = "#d2c4b5" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#998f84" }

progress_label  = { fg = "#e8e1dd", bold = true }
progress_normal = { fg = "#dbc3a3", bg = "reset" }
progress_error  = { fg = "#ffb4ab", bg = "reset" }

[mgr]
cwd = { fg = "#dbc3a3", bold = true }

find_keyword  = { fg = "#bdc7da", bold = true, italic = true, underline = true }
find_position = { fg = "#d2c4b5", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#dbc3a3", bg = "#dbc3a3" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#d2c4b5", bg = "#d2c4b5" }
marker_selected = { fg = "#bdc7da", bg = "#bdc7da" }

count_copied   = { fg = "#3d2e18", bg = "#dbc3a3" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#273140", bg = "#bdc7da" }

border_symbol = "│"
border_style  = { fg = "#998f84" }

hovered = { bg = "#3b3936" }

[indicator]
parent  = { fg = "#d2c4b5", bold = true }
current = { fg = "#dbc3a3", bold = true }
preview = { fg = "#998f84", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "#3d2e18", bg = "#dbc3a3" }
inactive = { fg = "#e8e1dd", bg = "#211f1d" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "#dbc3a3" }
title    = { fg = "#dbc3a3" }
value    = { fg = "#e8e1dd" }
selected = { reversed = true }

[pick]
border   = { fg = "#dbc3a3" }
active   = { fg = "#3d2e18", bg = "#dbc3a3" }
inactive = { fg = "#e8e1dd" }

[confirm]
border = { fg = "#dbc3a3" }
title  = { fg = "#dbc3a3" }
body   = { fg = "#e8e1dd" }
list   = { fg = "#e8e1dd" }
btn_yes = { fg = "#3d2e18", bg = "#dbc3a3" }
btn_no  = { fg = "#690005", bg = "#ffb4ab" }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "#dbc3a3" }
title_warn  = { fg = "#bdc7da" }
title_error = { fg = "#ffb4ab" }

[help]
on     = { fg = "#dbc3a3" }
run    = { fg = "#d2c4b5" }
desc   = { fg = "#e8e1dd" }
hovered = { reversed = true }
footer  = { fg = "#998f84" }

[which]
cols = 3
mask = { bg = "#211f1d" }
cand = { fg = "#dbc3a3" }
rest = { fg = "#998f84" }
desc = { fg = "#e8e1dd" }
separator = " → "
separator_style = { fg = "#998f84" }

[tasks]
border  = { fg = "#dbc3a3" }
title   = { fg = "#dbc3a3" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#d2c4b5" },
    { mime = "{audio,video}/*", fg = "#d2c4b5" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
    { mime = "application/{pdf,doc,rtf}", fg = "#dbc3a3" },
    { url = "*/", fg = "#d2c4b5", bold = true },
    { url = "*", fg = "#bdc7da" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []

[flavor]
dark  = "noctalia"
light = "noctalia"
