# Microscope custom keybindings for mpv

# Zoom in
+               add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
=               add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
KP_ADD          add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
Alt+=           add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
Alt++           add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
Ctrl+=          add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
Ctrl++          add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
WHEEL_UP        add video-zoom 0.1; show-text "Zoom: ${video-zoom}"
Ctrl+WHEEL_UP   add video-zoom 0.1; show-text "Zoom: ${video-zoom}"

# Zoom out
-               add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
_               add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
KP_SUBTRACT     add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
Alt+-           add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
Alt+_           add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
Ctrl+-          add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
Ctrl+_          add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
WHEEL_DOWN      add video-zoom -0.1; show-text "Zoom: ${video-zoom}"
Ctrl+WHEEL_DOWN add video-zoom -0.1; show-text "Zoom: ${video-zoom}"

# Reset Zoom & Pan
r               set video-zoom 0; set video-pan-x 0; set video-pan-y 0; show-text "Zoom: 100% (Reset)"
0               set video-zoom 0; set video-pan-x 0; set video-pan-y 0; show-text "Zoom: 100% (Reset)"
BS              set video-zoom 0; set video-pan-x 0; set video-pan-y 0; show-text "Zoom: 100% (Reset)"
MBTN_MID        set video-zoom 0; set video-pan-x 0; set video-pan-y 0; show-text "Zoom: 100% (Reset)"

# Pan around image (Arrow keys & Vim keys)
UP              add video-pan-y 0.05
DOWN            add video-pan-y -0.05
LEFT            add video-pan-x 0.05
RIGHT           add video-pan-x -0.05
k               add video-pan-y 0.05
j               add video-pan-y -0.05
h               add video-pan-x 0.05
l               add video-pan-x -0.05

# Image adjustments (helpful for reflective solder joints or dark PCB mask)
1               add brightness -2; show-text "Brightness: ${brightness}"
2               add brightness 2; show-text "Brightness: ${brightness}"
3               add contrast -2; show-text "Contrast: ${contrast}"
4               add contrast 2; show-text "Contrast: ${contrast}"
5               add gamma -2; show-text "Gamma: ${gamma}"
6               add gamma 2; show-text "Gamma: ${gamma}"

# Snapshot
s               screenshot video; show-text "Đã chụp ảnh màn hình soi mạch (lưu ~/Pictures)"
SPACE           screenshot video; show-text "Đã chụp ảnh màn hình soi mạch (lưu ~/Pictures)"

# Window controls
f               cycle fullscreen
t               cycle ontop
T               cycle ontop
q               quit
ESC             quit
